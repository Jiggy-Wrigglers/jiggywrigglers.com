name: Deploy to Forge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FORGE_HOST }}
          username: ${{ secrets.FORGE_USER }}
          key: ${{ secrets.FORGE_SSH_KEY }}
          script: |
            set -e
            cd /home/jiggywrigglers/jiggywrigglers.on-forge.com/public/wp-content/themes/jiggy-wrigglers-theme
            git remote set-url origin git@github.com:Jiggy-Wrigglers/jiggywrigglers.com.git
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            echo "Deployed: $(date)"

      - name: Purge Cloudflare cache
        continue-on-error: true
        run: curl -s "${{ secrets.SWCFPC_PURGE_URL }}" -o /dev/null